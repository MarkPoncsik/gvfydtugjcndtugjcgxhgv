<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Вопрос</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: linear-gradient(135deg, #ff9a9e 0%, #fad0c4 50%, #fbc2eb 100%);
    font-family: "Segoe UI", Tahoma, Arial, sans-serif;
  }

  .window {
    position: absolute;
    width: 320px;
    background: #ece9f1;
    border: 1px solid #0033aa;
    border-radius: 6px;
    box-shadow: 4px 4px 12px rgba(0,0,0,0.4);
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    overflow: hidden;
    user-select: none;
  }

  .titlebar {
    background: linear-gradient(to right, #0a246a, #3a6ea5);
    color: white;
    padding: 6px 10px;
    font-size: 14px;
    font-weight: bold;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .titlebar .close {
    background: #d9534f;
    width: 18px;
    height: 18px;
    border-radius: 3px;
    text-align: center;
    line-height: 18px;
    font-size: 12px;
    cursor: default;
  }

  .content {
    padding: 25px 20px;
    text-align: center;
    font-size: 17px;
    color: #222;
  }

  .buttons {
    display: flex;
    justify-content: center;
    gap: 20px;
    padding: 15px 0 20px 0;
  }

  button {
    padding: 6px 22px;
    font-size: 14px;
    border-radius: 4px;
    border: 1px solid #888;
    background: linear-gradient(to bottom, #f5f5f5, #d8d8d8);
    cursor: pointer;
  }

  button:active {
    background: #c0c0c0;
  }

  #yesBtn {
    position: fixed;
    transition: none;
  }

  .counter {
    position: fixed;
    bottom: 10px;
    right: 15px;
    color: rgba(0,0,0,0.4);
    font-size: 12px;
  }
</style>
</head>
<body>

<div class="window" id="mainWindow">
  <div class="titlebar">
    <span>Вопрос.exe</span>
    <span class="close">✕</span>
  </div>
  <div class="content">
    Хочешь целоваться? 😘
  </div>
  <div class="buttons">
    <button id="yesBtn">Да</button>
    <button id="noBtn">Нет</button>
  </div>
</div>

<div class="counter" id="counter"></div>

<script>
  const yesBtn = document.getElementById('yesBtn');
  const noBtn = document.getElementById('noBtn');
  const counter = document.getElementById('counter');
  let clicks = 0;
  const maxClicks = 10;

  function moveButtonRandomly() {
    const btnWidth = yesBtn.offsetWidth;
    const btnHeight = yesBtn.offsetHeight;
    const maxX = window.innerWidth - btnWidth - 10;
    const maxY = window.innerHeight - btnHeight - 10;
    const newX = Math.random() * maxX;
    const newY = Math.random() * maxY;
    yesBtn.style.left = newX + 'px';
    yesBtn.style.top = newY + 'px';
  }

  // При наведении курсора кнопка тоже убегает (для азарта)
  yesBtn.addEventListener('mouseenter', () => {
    if (clicks < maxClicks) moveButtonRandomly();
  });

  yesBtn.addEventListener('click', () => {
    clicks++;
    counter.textContent = clicks < maxClicks ? `Попыток: ${clicks} / ${maxClicks}` : '';

    if (clicks >= maxClicks) {
      showFinalWindow();
    } else {
      moveButtonRandomly();
    }
  });

  noBtn.addEventListener('click', () => {
    // "Нет" тоже слегка вредничает
    document.querySelector('.content').textContent = 'А придётся! 😏';
  });

  function showFinalWindow() {
    const win = document.createElement('div');
    win.className = 'window';
    win.style.top = '50%';
    win.style.left = '50%';
    win.innerHTML = `
      <div class="titlebar">
        <span>Итог.exe</span>
        <span class="close">✕</span>
      </div>
      <div class="content">
        Тогда бросай пить и курить! 🚭🍷
      </div>
      <div class="buttons">
        <button onclick="this.closest('.window').remove()">Хорошо</button>
      </div>
    `;
    document.body.appendChild(win);
    yesBtn.style.display = 'none';
    noBtn.style.display = 'none';
  }
</script>

</body>
</html>
